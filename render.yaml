# Render Blueprint: free web service, no credit card required.
services:
  - type: web
    name: podcast-companion
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GEMINI_API_KEY
        sync: false   # set in the Render dashboard, never in git
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
